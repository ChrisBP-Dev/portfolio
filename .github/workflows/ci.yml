name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gates
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # Tests with Firebase emulators
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Run tests with emulators
        run: pnpm exec firebase emulators:exec --only auth,firestore,storage "pnpm test"

      # Build — Admin SDK needs service account credentials for SSG data fetching
      - name: Build
        run: pnpm build
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ fromJson(secrets.FIREBASE_SERVICE_ACCOUNT).project_id }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ fromJson(secrets.FIREBASE_SERVICE_ACCOUNT).client_email }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ fromJson(secrets.FIREBASE_SERVICE_ACCOUNT).private_key }}

      # Lighthouse CI — exclude admin pages (client:only shells have no static content)
      - name: Remove admin pages from Lighthouse scan
        run: rm -rf dist/admin

      - name: Lighthouse CI
        run: pnpm exec lhci autorun

      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: portfolio-chrisbp
